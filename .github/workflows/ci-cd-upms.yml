name: UPMS CI/CD

on:
  push:
    branches:
      - Production
      - Development

env:
  IMAGE_NAME: upms
  PROJECT_PATH: src/UPMS.Web         # <- adjust to your repo if different
  DOTNET_VERSION: '10.0'             # .NET 10 / adjust if needed

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: ${{ env.PROJECT_PATH }}
        run: dotnet restore

      - name: Run tests
        id: tests
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -e
          dotnet test --no-build --verbosity normal
        continue-on-error: false

  deploy:
    name: Build image, push to ACR & Deploy (production only)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/Production'      # only run on production branch
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GitHub Container Registry
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./src/UPMS.Web/Dockerfile   # <- adjust if Dockerfile is elsewhere
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
