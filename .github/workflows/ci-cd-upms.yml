name: UPMS CI/CD

on:
  push:
    branches:
      - Production
      - Development

env:
  IMAGE_NAME: upms
  PROJECT_PATH: src/UPMS.Web         # <- adjust to your repo if different
  DOTNET_VERSION: '10.0'             # .NET 10 / adjust if needed

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: ${{ env.PROJECT_PATH }}
        run: dotnet restore

      - name: Run tests
        id: tests
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -e
          dotnet test --no-build --verbosity normal
        continue-on-error: false

  build:
    name: Build & Upload Artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: ${{ env.PROJECT_PATH }}
        run: dotnet restore

      - name: Publish
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          dotnet publish -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: upms-publish
          path: ${{ env.PROJECT_PATH }}/publish

  deploy:
    name: Build image, push to ACR & Deploy (production only)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/production'      # only run on production branch
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image to ACR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./src/UPMS.Web/Dockerfile   # <- adjust if Dockerfile is elsewhere
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy image to Azure Web App (App Service)
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.WEBAPP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
