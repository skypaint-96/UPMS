name: UPMS CI/CD

on:
  push:
    branches:
      - Production
      - Development

env:
  IMAGE_NAME: upms
  PROJECT_API: src/UPMS.Api
  PROJECT_FRONTEND: src/UPMS.Frontend
  PROJECT_WORKER: src/UPMS.Worker
  DOTNET_VERSION: '10.0'
  NODE_VERSION: '18'

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore API & Worker
        run: |
          dotnet restore ${{ env.PROJECT_API }}
          dotnet restore ${{ env.PROJECT_WORKER }}

      - name: Run API tests
        run: dotnet test ${{ env.PROJECT_API }} --no-build --verbosity normal

      - name: Run Worker tests
        run: dotnet test ${{ env.PROJECT_WORKER }} --no-build --verbosity normal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Frontend
        working-directory: ${{ env.PROJECT_FRONTEND }}
        run: |
          npm ci
          npm run build

  deploy:
    name: Build image, push to ACR & Deploy (production only)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/Production'      # only run on production branch
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push component images
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-worker:${{ github.sha }}
          file: |
            ./src/UPMS.Api/Dockerfile
            ./src/UPMS.Frontend/Dockerfile
            ./src/UPMS.Worker/Dockerfile
