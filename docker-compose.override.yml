services:
  web:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - UPMS_CONNECTION_STRING=Host=db;Port=5432;Database=upms;Username=upms;Password=upms
    ports:
      - "8081:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upms
      POSTGRES_PASSWORD: upms
      POSTGRES_DB: upms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upms -d upms"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upms
      POSTGRES_PASSWORD: upms_test
      POSTGRES_DB: upms_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upms -d upms_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  pgdata_test:
