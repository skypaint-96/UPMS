# Development override - mounts source and enables permissive auth mode.
# Do NOT commit local secret files or .env files to VCS.
services:
  UPMS_web:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - AUTH_MODE=None
      # For local development you may set UPMS_CONNECTION_STRING directly, via a .env file,
      # or mount a host file into ./secrets/ and map to /run/secrets/ in production only.
      - UPMS_CONNECTION_STRING=Host=UPMS_db;Port=5432;Database=upms;Username=upms;Password=upms
      # Dev-friendly direct secrets (avoid committing these):
      - UPMS_DB_PASSWORD=upms
      - AZURE_CLIENT_SECRET=dev_secret
    ports:
      - "8081:8080"
    volumes:
      # Mount source for live editing / dotnet watch in dev
      - ./src/UPMS.Web:/app/src/UPMS.Web:ro
      # Optional: mount local secret files for testing (create ./secrets/upms_db_password etc.)
      # - ./secrets:/run/secrets:ro

  UPMS_db:
    environment:
      # For development only: use simple passwords or provide via environment (do NOT commit these)
      - POSTGRES_USER=upms
      - POSTGRES_PASSWORD=upms
      - POSTGRES_DB=upms

  UPMS_db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upms
      POSTGRES_PASSWORD: upms_test
      POSTGRES_DB: upms_test
    ports:
        - "5433:5432"  # Uncomment to expose test DB for local admin/debug
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upms -d upms_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  pgdata_test:
