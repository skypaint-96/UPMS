# docker-compose for UPMS
# NOTE: Do NOT commit secret values or .env files to version control.
services:
  UPMS_web:
    image: ${DOCKER_REGISTRY-}upmsweb
    build:
      context: .
      dockerfile: src/UPMS.Web/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AUTH_MODE=Entra
      # Prefer supplying the DB connection string via a docker secret file.
      - UPMS_CONNECTION_STRING_FILE=/run/secrets/upms_connection_string
      # Azure AD settings: ClientId / TenantId may be provided as env vars; ClientSecret should be provided as a docker secret.
      - AzureAd__ClientId=${AZUREAD__CLIENTID}
      - AzureAd__TenantId=${AZUREAD__TENANTID}
      - AzureAd__ClientSecret_FILE=/run/secrets/upms_azure_client_secret
    # Removed `secrets:` here because docker compose (non-swarm) does not support external secrets.
    # In Swarm/Kubernetes you can mount secrets to /run/secrets and keep the `secrets:` mapping.
    # The app reads secret files from /run/secrets when available (see *_FILE env vars above).
    volumes:
      - upms_keys:/app/keys
    depends_on:
      UPMS_db:
        condition: service_healthy

  UPMS_db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      # Use POSTGRES_PASSWORD_FILE so password can be supplied via docker secret
      - POSTGRES_USER=upms
      - POSTGRES_PASSWORD_FILE=/run/secrets/upms_db_password
      - POSTGRES_DB=upms
    # Removed `secrets:` here because docker compose (non-swarm) does not support external secrets.
    # For Swarm, provide the DB password as a Docker secret mounted at /run/secrets/upms_db_password.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upms -d upms"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  upms_keys:

# Swarm-only: example secret definitions (commented out for local compose)
# To enable secrets in Docker Swarm, uncomment and manage secrets externally:
# secrets:
#   upms_connection_string:
#     external: true
#   upms_azure_client_secret:
#     external: true
#   upms_db_password:
#     external: true
#
# Example commands to create secrets in Swarm:
# docker secret create upms_connection_string ./secrets/upms_connection_string
# docker secret create upms_azure_client_secret ./secrets/upms_azure_client_secret
# docker secret create upms_db_password ./secrets/upms_db_password
#
# Local development: provide secrets via environment variables, a .env file, or mount host files to ./secrets/.
# Warning: do NOT commit .env or files in ./secrets/ to version control.
