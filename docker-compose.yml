services:
  UPMS_frontend:
    image: ghcr.io/skypaint-96/upms-frontend:latest
    build:
      context: .
      dockerfile: src/UPMS.Frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      UPMS_api:
        condition: service_started

  UPMS_api:
    image: ghcr.io/skypaint-96/upms-api:latest
    build:
      context: .
      dockerfile: src/UPMS.Api/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - UPMS_CONNECTION_STRING=Host=UPMS_db;Port=5432;Database=upms;Username=upms;Password={{ secrets.UPMS_DB_PASSWORD }}
      - UPMS_ARTIFACTS_ROOT=/var/lib/upms
      - Auth__Mode=ApiKey
      - Auth__ApiKey__HeaderName=X-UPMS-API-Key
      - Auth__ApiKey__Keys__0__Name=external
      - Auth__ApiKey__Keys__0__Value=change-me
      - Auth__ApiKey__Keys__0__Roles__0=upms-reader
      - Auth__ApiKey__Keys__0__Roles__1=upms-writer
    volumes:
      - upms_artifacts:/var/lib/upms
    depends_on:
      UPMS_db:
        condition: service_healthy

  UPMS_worker:
    image: ghcr.io/skypaint-96/upms-worker:latest
    build:
      context: .
      dockerfile: src/UPMS.Worker/Dockerfile
    environment:
      - UPMS_CONNECTION_STRING=Host=UPMS_db;Port=5432;Database=upms;Username=upms;Password={{ secrets.UPMS_DB_PASSWORD }}
      - UPMS_ARTIFACTS_ROOT=/var/lib/upms
    volumes:
      - upms_artifacts:/var/lib/upms
    depends_on:
      UPMS_api:
        condition: service_started

  UPMS_db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=upms
      - POSTGRES_PASSWORD={{ secrets.UPMS_DB_PASSWORD }}
      - POSTGRES_DB=upms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upms -d upms"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  upms_artifacts:
