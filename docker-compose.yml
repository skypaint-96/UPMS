version: "3.9"

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  db:
    image: postgres:15-alpine
    container_name: upms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-upms}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-upms} -d ${POSTGRES_DB:-upms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - upms-network

  # =============================================================================
  # MinIO Object Storage (S3-compatible)
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: upms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - upms-network

  # =============================================================================
  # ASP.NET Core Backend API
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: upms-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-upms};Username=${POSTGRES_USER:-upms};Password=${POSTGRES_PASSWORD:-upms_dev_password}"
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      Minio__BucketName: ${MINIO_BUCKET:-upms-artifacts}
      Minio__UseSSL: "false"
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - upms-network

  # =============================================================================
  # Background Worker Service
  # =============================================================================
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: upms-worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-upms};Username=${POSTGRES_USER:-upms};Password=${POSTGRES_PASSWORD:-upms_dev_password}"
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      Minio__BucketName: ${MINIO_BUCKET:-upms-artifacts}
      Minio__UseSSL: "false"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - upms-network

  # =============================================================================
  # React + Vite Frontend (Development Server)
  # =============================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: upms-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./src/Frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - upms-network

  # =============================================================================
  # Adminer - Database Administration UI (Optional)
  # =============================================================================
  adminer:
    image: adminer:latest
    container_name: upms-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - upms-network
    profiles:
      - tools

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: upms-postgres-data
  minio_data:
    name: upms-minio-data

# =============================================================================
# Networks
# =============================================================================
networks:
  upms-network:
    name: upms-network
    driver: bridge
